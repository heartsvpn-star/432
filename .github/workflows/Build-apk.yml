name: Build Base APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      commit_apk:
        description: 'Commit built APK to backend/app/factory/baseApp/Fason.apk'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Point Gradle at the preinstalled SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" > fason/local.properties
          chmod +x fason/gradlew

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build APK
        working-directory: fason
        run: ./gradlew --no-daemon assemble${{ inputs.build_type == 'release' && 'Release' || 'Debug' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fason-apk-${{ inputs.build_type }}
          path: fason/app/build/outputs/apk/${{ inputs.build_type }}/*.apk
          if-no-files-found: error

      - name: Commit APK to repo
        if: ${{ inputs.commit_apk }}
        run: |
          set -e
          SRC=$(ls fason/app/build/outputs/apk/${{ inputs.build_type }}/*.apk | head -n1)
          cp "$SRC" backend/app/factory/baseApp/Fason.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/factory/baseApp/Fason.apk
          git commit -m "chore: update base APK (${GITHUB_SHA::7})" || echo "nothing to commit"
          git push
